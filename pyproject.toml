[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cited-rag-bot"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1", "httpx>=0.27,<1", "openai>=1.100,<3",
  "pydantic>=2.8,<3", "pypdf>=5,<7",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
